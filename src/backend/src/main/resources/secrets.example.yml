# ─────────────────────────────────────────────────────────────────────────────
# Secrets TEMPLATE (safe to commit, contains no secrets)
#
# 1. Copy this file to "secrets.yml" in the same folder (it is git-ignored).
# 2. Fill in your own values. Anything left out falls back to
#    application.properties (the app still starts; that feature is disabled).
# 3. Restart the backend.
# ─────────────────────────────────────────────────────────────────────────────

# Stripe test keys (https://dashboard.stripe.com/test/apikeys)
stripe:
  api:
    public:
      key: "pk_test_..."
    secret:
      key: "sk_test_..."

# Gmail SMTP app password (Google Account → Security → App passwords)
spring:
  mail:
    password: ""

# Signs login tokens. Use any long random string (at least 32 characters).
jwt:
  secret: ""

# OAuth2 social login. A provider left empty is turned off.
# Callback URLs: http://localhost:8081/login/oauth2/code/github  (and /google)
app:
  # Encrypts uploaded ID documents (AES-256-GCM). Generate with:  openssl rand -base64 32
  # Keep a backup of it: documents uploaded with a key cannot be read without it.
  # Left empty, document uploads are turned off.
  uploads:
    encryption-key: ""
  # Built-in admin login (email is app.admin.email in application.properties)
  admin:
    password: ""
  oauth2:
    github:
      client-id: ""        # GitHub → Settings → Developer settings → OAuth Apps
      client-secret: ""
    google:
      client-id: ""        # Google Cloud Console → APIs & Services → Credentials
      client-secret: ""
