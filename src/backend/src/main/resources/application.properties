spring.application.name=courtly
stripe.api.public.key=${STRIPE_PUBLIC_KEY:}
# Real keys live in secrets.yml (git-ignored); see secrets.example.yml
stripe.api.secret.key=${STRIPE_SECRET_KEY:}

# Enable H2 Database
spring.datasource.url=jdbc:h2:file:./database/courtlydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

server.port=8081
# Tell Hibernate to automatically create your tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.mvc.throw-exception-if-no-handler-found=true
server.error.include-message=always
server.error.include-stacktrace=on_param

# Enable the web console to view your database visually
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits (NFR 2.2.3)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Gmail SMTP ─────────────────────────────────────────────────────────────────
# 1. Enable 2-Step Verification on your Google account
# 2. Go to: Google Account → Security → 2-Step Verification → App passwords
# 3. Create an app password (select "Mail" + "Windows Computer")
# 4. Put the 16-char password in secrets.yml (spring.mail.password), not here
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=expensetracker43@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false

jwt.secret=Courtly-Change-This-Secret-Key-In-Production-At-Least-32-Chars
jwt.expiration-ms=3600000

# ── OAuth2 social login (Google / GitHub) ─────────────────────────────────────
# Put your credentials in src/main/resources/secrets.yml (git-ignored;
# copy secrets.example.yml). If a value is blank there, the environment
# variables GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / GOOGLE_CLIENT_ID /
# GOOGLE_CLIENT_SECRET are used instead.
spring.config.import=optional:classpath:secrets.yml
# A provider whose id/secret is empty is simply disabled (its button is hidden).
# Callback URL to register with each provider:
#   http://localhost:<server.port>/login/oauth2/code/google
#   http://localhost:<server.port>/login/oauth2/code/github
# Frontend origins the backend may redirect to after login (comma-separated)
app.oauth2.allowed-redirect-origins=${OAUTH2_ALLOWED_REDIRECT_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
