<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Keep the token in the URL fragment from leaking via the Referer header -->
    <meta name="referrer" content="no-referrer">
    <title>Courtly - Signing In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-sans px-4">
    <div id="oauthCallback" class="w-full max-w-sm bg-white/5 border border-white/10 rounded-2xl p-8 text-center space-y-4">
        <div id="oauthSpinner" class="mx-auto w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="oauthStatus" class="text-lg font-semibold">Completing sign-in…</p>
        <div id="oauthError" class="hidden space-y-4">
            <p id="oauthErrorText" class="text-sm text-rose-300 bg-rose-900/40 border border-rose-700/60 rounded-xl px-4 py-3"></p>
            <a href="index.html" class="inline-block w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition">Back to Sign In</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="mvc/models/oauth-model.js"></script>
    <script src="mvc/controllers/oauth-controller.js"></script>
</body>
</html>
