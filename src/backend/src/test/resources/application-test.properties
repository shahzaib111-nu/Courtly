# ─────────────────────────────────────────────────────────────────────────────
# Test configuration, loaded by IntegrationTest via @TestPropertySource.
# Overrides application.properties so tests never touch the real H2 file,
# real SMTP server, real Stripe account or real OAuth apps.
# ─────────────────────────────────────────────────────────────────────────────

# Fresh in-memory database per test JVM (data.sql still seeds the demo data)
spring.datasource.url=jdbc:h2:mem:courtly-test;DB_CLOSE_DELAY=-1
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# No real e-mail (EmailService is also replaced by a mock in IntegrationTest)
spring.mail.host=localhost
spring.mail.username=test@courtly.local
spring.mail.password=

# Dummy Stripe key: payment tests only cover validation/security, never the API
stripe.api.secret.key=sk_test_dummy
stripe.api.public.key=pk_test_dummy

# Fake OAuth2 apps so both providers are "configured" in tests
app.oauth2.github.client-id=test-github-client
app.oauth2.github.client-secret=test-github-secret
app.oauth2.google.client-id=test-google-client
app.oauth2.google.client-secret=test-google-secret
app.oauth2.allowed-redirect-origins=http://localhost:5501

jwt.secret=Courtly-Test-Secret-Key-That-Is-At-Least-32-Characters
jwt.expiration-ms=3600000

logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

# The fake SMTP host above is unreachable, so don't let it mark /actuator/health as DOWN
management.health.mail.enabled=false

# Built-in admin (normally set in secrets.yml)
app.admin.password=Admin123
app.cors.allowed-origins=http://localhost:5501

# Fixed test key for encrypted document uploads (32 zero-to-31 bytes, Base64)
app.uploads.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
